# Local dev orchestration.
#   docker compose -f infra/docker-compose.yml up --build
#
# Spins up the Go server (built from apps/server/Dockerfile) and an optional
# Postgres. The server tolerates Postgres being missing -- auth/history just
# no-op -- so you can run `up server` alone if you don't need the DB.
#
# This file is for LOCAL DEV ONLY. Production deploys use Render/Koyeb/etc.
# directly with the same Dockerfile.

services:
  server:
    build:
      context: ../apps/server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Set a stable JWT_SECRET so tokens survive container restarts in dev.
      # Don't reuse this in production -- generate a fresh 32+ char string.
      JWT_SECRET: dev-only-not-for-prod-change-me-aaaaaaaaaaaaaaaa
      # Point at the postgres service below. Omit this to run without a DB.
      DATABASE_URL: postgres://multitype:multitype@db:5432/multitype?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: multitype
      POSTGRES_PASSWORD: multitype
      POSTGRES_DB: multitype
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multitype -d multitype"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
